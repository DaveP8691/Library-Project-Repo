name: Dave CI/CD Job

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# if a workflow is running on the same branch, delete and run ours.

# --------------------------------------------------
# CONCURRENCY
# Cancel older runs for the same branch
# --------------------------------------------------

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --------------------------------------------------
# GLOBAL VARIABLES
# --------------------------------------------------

env:
  IMAGE_NAME: library-quality-analysis

# ==================================================
# TEST JOB
# ==================================================

jobs:

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

# This workflow contains a single job called "build"
build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
# Setting up python
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
# Install our dependencies 
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
#Run our tests     
      - name: Run unittest tests
        run: |
          python -m unittest discover \
          -s Testing \
          -p "*_unit_test.py" \
          -v
          
      - name: Run pytest tests
        run: |
          python -m pytest testing \
          --ignore-glob="*_unit_test.py" \
          -v

# ==================================================
# BUILD JOB
# Only runs if the test job succeeds
# ==================================================

  build:
    name: Building Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4
# Build Docker image
      - name: Create Image
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag $IMAGE_NAME:${{ github.sha }} \
            .

# Run Docker image
      - name: Run Docker Image
        run: |
          docker run --rm \
            $IMAGE_NAME:${{ github.sha }}

# Save Docker image as a .tar file
      - name: Save Docker Image
        run: |
          docker save \
            $IMAGE_NAME:${{ github.sha }} \
            --output $IMAGE_NAME.tar

# Upload Docker image as a GitHub Actions artifact
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          path: ${{ env.IMAGE_NAME }}.tar
          if-no-files-found: error
